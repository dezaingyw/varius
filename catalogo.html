<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tienda - Varius</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="assets/css/carrito.css">
  <link rel="stylesheet" href="assets/css/catalogo.css">

  <!-- Meta Pixel Code -->
  <script>
    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return;
      n = f.fbq = function () {
        n.callMethod ?
          n.callMethod.apply(n, arguments) : n.queue.push(arguments)
      };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
      n.queue = [];
      t = b.createElement(e);
      t.async = !0;
      t.src = v;
      s = b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t, s)
    }(window, document, 'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '959500979748263');
    fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=959500979748263&ev=PageView&noscript=1" /></noscript>
</head>

<body>
  <header class="site-header">
    <div class="brand">
      <a href="./">
        <img src="admin/assets/img/logo-horizontal.png" width="100rem" alt="Varius">
      </a>
    </div>
    <nav class="top-actions">
      <a href="login.html" class="cart-btn" aria-label="Abrir carrito">👤</a>
      <button id="openCartBtn" class="cart-btn" aria-label="Abrir carrito">🛒 <span id="cartCount">0</span></button>
    </nav>
  </header>

  <main class="container">
    <div class="catalog-controls-row">
      <div>
        <label>Mostrar
          <select id="catalogPageSize" class="catalog-select">
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="250">250</option>
          </select>
          por página
        </label>
      </div>
    </div>
    <div class="catalog-filters-row">
      <div class="catalog-categories" id="catalogCategories"></div>
      <div class="search-offer-row">
        <div class="catalog-search-wrapper">
          <input type="text" id="catalogSearch" class="catalog-search" placeholder="Buscar producto..."
            autocomplete="off" aria-label="Buscar producto" tabindex="0" />
          <span class="search-shortcut-inside">Ctrl + K</span>
        </div>
        <label class="offer-toggle-label" for="offerToggle">
          <input type="checkbox" id="offerToggle">
          <span class="offer-toggle-switch" tabindex="0"><span></span></span>
          <span class="offer-switch-text">Solo ofertas</span>
        </label>
      </div>
    </div>
    <div class="section-divider">
      <span>Catalogo de Productos</span>
    </div>
    <!-- Productos (grid) - se usa en otras vistas, conservar -->
    <section class="products-grid" id="productsGrid" aria-live="polite" style="margin-top:22px">
      <!-- Renderizado por script.js -->
    </section>
    <div id="catalogPagination" class="pagination-controls" style="display: flex; gap: 6px;"></div>
  </main>

  <!-- Custom confirm modal (mejor estilo y accesible) -->
  <div id="confirmModal" class="confirm-modal hidden" role="dialog" aria-modal="true" aria-hidden="true"
    aria-labelledby="confirmTitle">
    <div class="confirm-panel" role="document">
      <div class="confirm-body">
        <h4 id="confirmTitle" class="confirm-title">Confirmar</h4>
        <p id="confirmMessage">¿Estás seguro?</p>
      </div>
      <div class="confirm-actions">
        <button id="confirmCancel" class="btn-secondary">Cancelar</button>
        <button id="confirmAccept" class="btn-primary">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- Product modal (slider + detalles) -->
  <div id="productModal" class="product-modal hidden" role="dialog" aria-modal="true" aria-hidden="true"
    aria-labelledby="productModalTitle">
    <div class="product-modal-panel" role="document">
      <button id="productModalClose" class="product-modal-close" aria-label="Cerrar">✕</button>
      <div class="product-modal-body">
        <div class="product-modal-left">
          <div class="product-modal-slider" id="productModalSlider" aria-live="polite"></div>
          <div class="product-modal-thumbs" id="productModalThumbs" aria-hidden="false"></div>
          <button class="product-modal-nav prev" id="productModalPrev" aria-label="Anterior foto">‹</button>
          <button class="product-modal-nav next" id="productModalNext" aria-label="Siguiente foto">›</button>
        </div>
        <div class="product-modal-right">
          <div id="productRibbon" class="product-ribbon" aria-hidden="true">Oferta</div>
          <h2 id="productModalTitle"></h2>
          <div id="productModalCategory" class="product-modal-category"></div>
          <div id="productModalPrices" class="product-modal-prices"></div>
          <div style="max-height: 250px; overflow-y: auto; padding-right: 10px; margin-bottom: 15px;">
            <p id="productModalDescription" class="product-modal-description"></p>
          </div>
          <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
            <label style="display:flex;align-items:center;gap:8px">Cantidad:
              <input id="productModalQty" type="number" min="1" max="999" value="1"
                style="width:80px;padding:6px;border-radius:8px;border:1px solid #e6eef6">
            </label>
            <button id="productModalAdd" class="btn-primary">Agregar</button>
            <button id="productModalViewFull" class="btn-secondary" style="display:none">Ver página</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirmación simple inline -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <footer class="site-footer">
    <div class="container">
      <div>© Varius - Todos los derechos reservados</div>
    </div>
  </footer>

  <script type="module" src="assets/js/catalogo.js"></script>
  <script type="module" src="assets/js/contact-layout.js"></script>
  <script type="module" src="assets/js/ui-animations.js"></script>
  <script type="module" src="assets/js/visits.js"></script>
  <script>
    const cartBtn = document.getElementById('openCartBtn');
    cartBtn.addEventListener('click', () => {
      window.location.href = 'carrito.html';
    });
  </script>
</body>

</html>
